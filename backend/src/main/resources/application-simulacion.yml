# Simulador: otra instancia, con su propia base, para probar sin tocar los datos reales (docs/testing.md).
# Nunca activar este perfil en la instancia real.
spring:
  datasource:
    # Base fija y aparte: las fechas futuras no deben mezclarse con otros datos.
    url: jdbc:postgresql://${JANERY_DB_HOST:localhost}:${JANERY_DB_PORT:5432}/janery_simulacion?currentSchema=${JANERY_DB_SCHEMA:janery}&sslmode=${JANERY_DB_SSLMODE:prefer}&reWriteBatchedInserts=true
  flyway:
    # Reiniciar el simulador vacía su base. SimulacionConfig impide arrancar este perfil sobre otra base.
    clean-disabled: false

server:
  # Corre junto a la instancia real.
  port: ${JANERY_SIMULADOR_PUERTO:8081}

janery:
  jwt:
    # Clave propia: un token con fecha futura no debe servir fuera de la simulación.
    secret: simulacion-${JANERY_JWT_SECRET:}
  cors:
    allowed-origins: ${JANERY_SIMULADOR_ORIGENES:http://localhost:4201}
  simulador:
    activo: true
